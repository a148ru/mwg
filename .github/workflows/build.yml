name: Build and Release Go Application

on:
  push:
    tags:
      - 'v*' # Срабатывает при отправке тега, например v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Обязательно, иначе невозможно создать Release и загрузить файлы

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="mwg-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -o "${OUTPUT_NAME}" .
          # Упаковка в zip (сохраняется в текущей директории)
          zip "mwg-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "${OUTPUT_NAME}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        # Срабатывает только при пуше тега
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mwg-${{ matrix.goos }}-${{ matrix.goarch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}